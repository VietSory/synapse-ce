name: Codex 402 source publish test clock

on:
  push:
    branches:
      - codex/402-sanctioned-source-publish

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch source publish test clock
        shell: python
        run: |
          from pathlib import Path

          primary = Path("internal/usecase/projectuc/source_publish_test.go")
          text = primary.read_text()
          old = '\t"testing"\n'
          if text.count(old) != 1:
              raise SystemExit("source_publish_test.go testing import anchor mismatch")
          text = text.replace(old, '\t"testing"\n\t"time"\n', 1)
          anchor = 'type sourceAuditAnalysisStore struct {\n'
          if text.count(anchor) != 1:
              raise SystemExit("sourceAuditAnalysisStore anchor mismatch")
          helper = 'func sourcePublishTestClock() fixedClock {\n\treturn fixedClock{now: time.Date(2026, 8, 10, 2, 0, 0, 0, time.UTC)}\n}\n\n'
          text = text.replace(anchor, helper + anchor, 1)
          primary.write_text(text)

          paths = [
              Path("internal/usecase/projectuc/source_publish_test.go"),
              Path("internal/usecase/projectuc/source_publish_target_test.go"),
              Path("internal/usecase/projectuc/source_publish_audit_test.go"),
          ]
          count = 0
          for p in paths:
              text = p.read_text()
              hits = text.count("fixedClock{}")
              count += hits
              p.write_text(text.replace("fixedClock{}", "sourcePublishTestClock()"))
          if count != 4:
              raise SystemExit(f"expected four fixedClock replacements, found {count}")
      - name: Format and verify
        run: |
          gofmt -w internal/usecase/projectuc/source_publish_test.go internal/usecase/projectuc/source_publish_target_test.go internal/usecase/projectuc/source_publish_audit_test.go
          git diff --check
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/usecase/projectuc/source_publish_test.go internal/usecase/projectuc/source_publish_target_test.go internal/usecase/projectuc/source_publish_audit_test.go
          git diff --cached --quiet && exit 0
          git commit -m "test(appsec): use nonzero source publish clock"
          git push origin HEAD:codex/402-sanctioned-source-publish
