name: One-shot #624 telemetry composition patch

on:
  push:
    branches: [feat/624-telemetry-transport]
    paths: [.github/workflows/624-wire-telemetry.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/624-telemetry-transport
          fetch-depth: 0
      - name: Wire telemetry transport at the production composition root
        shell: python
        run: |
          from pathlib import Path

          path = Path("cmd/synapse-api/main.go")
          source = path.read_text()
          old = "\t\trouter.SetFleet(agentSvc, workSvc, clock.Now, cfg.FleetClientCertHeader)\n\t\trouter.SetFleetAdmin(agentSvc)\n\n\t\t// Operator-controlled update rollout (#412 req 9). Wiring it is what makes an update offer"
          new = "\t\trouter.SetFleet(agentSvc, workSvc, clock.Now, cfg.FleetClientCertHeader)\n\t\trouter.SetFleetAdmin(agentSvc)\n\t\tif terr := wireFleetTelemetry(router, databasePool, auditLog, clock, log); terr != nil {\n\t\t\tlog.Error(\"fleet telemetry transport init failed\", \"err\", terr)\n\t\t\tos.Exit(1)\n\t\t}\n\n\t\t// Operator-controlled update rollout (#412 req 9). Wiring it is what makes an update offer"
          if source.count(old) != 1:
              raise SystemExit(f"expected exactly one production fleet composition anchor, found {source.count(old)}")
          path.write_text(source.replace(old, new, 1))
      - name: Commit production wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cmd/synapse-api/main.go
          git diff --cached --check
          git commit -m "feat(telemetry): wire transport into api runtime"
          git push origin HEAD:feat/624-telemetry-transport
