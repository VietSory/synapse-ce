name: Telemetry Transport Race

on:
  pull_request:
    paths:
      - "cmd/synapse-agent/**"
      - "cmd/synapse-api/telemetry_runtime*.go"
      - "internal/adapter/httpapi/fleet_telemetry*.go"
      - "internal/domain/fleetagent/**"
      - "internal/domain/telemetry/**"
      - "internal/domain/telemetryschema/**"
      - "internal/infrastructure/fleetclient/**"
      - "internal/infrastructure/persistence/memory/telemetry*.go"
      - "internal/infrastructure/persistence/postgres/telemetry*.go"
      - "internal/infrastructure/spool/**"
      - "internal/usecase/fleet/telemetry/**"
      - "internal/usecase/ports/telemetry_delivery.go"
      - "internal/usecase/ports/telemetry_agent_gap.go"
      - "migrations/0109_telemetry_delivery.sql"
      - "migrations/0110_telemetry_agent_gaps.sql"
      - ".github/workflows/telemetry-transport-race.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  race:
    name: Telemetry ingest + agent spool (-race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Race-sensitive telemetry transport tests
        run: >-
          go test -race -count=1
          ./internal/usecase/fleet/telemetry
          ./internal/infrastructure/spool
          ./cmd/synapse-agent

  patch-openapi-once:
    name: Patch canonical telemetry gap OpenAPI once
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/624-telemetry-transport-submission
          fetch-depth: 0
      - name: Patch canonical OpenAPI telemetry contract
        shell: python
        run: |
          from pathlib import Path

          path = Path("api/openapi.yaml")
          text = path.read_text()
          if "application/vnd.synapse.telemetry-gap+json:" in text:
              raise SystemExit(0)

          request_anchor = '''                payload: {type: string, format: byte, description: Base64-encoded canonical uncompressed JSON telemetry-envelope array}
      responses:
'''
          request_replacement = '''                payload: {type: string, format: byte, description: Base64-encoded canonical uncompressed JSON telemetry-envelope array}
          application/vnd.synapse.telemetry-gap+json:
            schema:
              type: object
              additionalProperties: false
              required: [manifest, key_id, signature]
              properties:
                manifest:
                  type: object
                  additionalProperties: false
                  required: [protocol_version, gap_id, agent_id, host_id, agent_session_id, asset_id, stream_id, priority, epoch, known_sequence, from_sequence, to_sequence, reason, count, occurred_at]
                  properties:
                    protocol_version: {type: integer, const: 1}
                    gap_id: {type: string, minLength: 1, maxLength: 128}
                    agent_id: {type: string, minLength: 1}
                    host_id: {type: string, minLength: 1}
                    agent_session_id: {type: string, minLength: 1}
                    asset_id: {type: string, minLength: 1}
                    stream_id: {type: string, minLength: 1}
                    priority: {type: integer, minimum: 0, maximum: 3}
                    epoch: {type: integer, minimum: 1, maximum: 9223372036854775807}
                    known_sequence: {type: boolean, description: When false, from_sequence and to_sequence must both be zero and cannot advance ACK.}
                    from_sequence: {type: integer, minimum: 0, maximum: 9223372036854775807}
                    to_sequence: {type: integer, minimum: 0, maximum: 9223372036854775807}
                    reason:
                      type: string
                      enum: [quota_eviction, quota_backpressure, corrupt_frame, torn_write, io_failure, unsynced_tail, state_recovery]
                    count: {type: integer, minimum: 1, maximum: 9223372036854775807}
                    occurred_at: {type: string, format: date-time}
                key_id: {type: string, minLength: 1}
                signature: {type: string, format: byte, description: Base64-encoded Ed25519 signature over the signed gap manifest}
      responses:
'''
          if text.count(request_anchor) != 1:
              raise SystemExit(f"telemetry request anchor count={text.count(request_anchor)}, want 1")
          text = text.replace(request_anchor, request_replacement, 1)

          response_old = '''        "200":
          description: Batch durably ingested or idempotently replayed
          content:
            application/json:
              schema:
                type: object
                required: [ack, new_events, gaps]
                properties:
                  ack:
                    type: object
                    required: [priority, epoch, through]
                    properties:
                      priority: {type: integer, minimum: 0, maximum: 3}
                      epoch: {type: integer, minimum: 1}
                      through: {type: integer, minimum: 0}
                  new_events: {type: integer, minimum: 0}
                  gaps:
                    type: array
                    description: Unresolved durable delivery gaps; gap objects retain legacy Go field names.
                    items: {type: object, additionalProperties: true}
'''
          response_new = '''        "200":
          description: Batch or signed agent-origin gap durably accepted; exact retries are idempotent
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  additionalProperties: false
                  required: [ack, new_events, gaps]
                  properties:
                    ack:
                      type: object
                      required: [priority, epoch, through]
                      properties:
                        priority: {type: integer, minimum: 0, maximum: 3}
                        epoch: {type: integer, minimum: 1}
                        through: {type: integer, minimum: 0}
                    new_events: {type: integer, minimum: 0}
                    gaps:
                      type: array
                      description: Unresolved durable delivery gaps; gap objects retain legacy Go field names.
                      items: {type: object, additionalProperties: true}
                - type: object
                  additionalProperties: false
                  required: [gap_id]
                  properties:
                    gap_id: {type: string, minLength: 1, description: Durable idempotent acknowledgement of the signed agent-origin gap.}
'''
          if text.count(response_old) != 1:
              raise SystemExit(f"telemetry response anchor count={text.count(response_old)}, want 1")
          text = text.replace(response_old, response_new, 1)

          old_summary = "      summary: Ingest a signed telemetry delivery batch\n"
          new_summary = "      summary: Ingest a signed telemetry delivery batch or durable spool-loss gap\n"
          if text.count(old_summary) != 1:
              raise SystemExit(f"telemetry summary anchor count={text.count(old_summary)}, want 1")
          text = text.replace(old_summary, new_summary, 1)

          old_description = '''        Agent-authenticated A3 ingest. The request may be sent as raw JSON or Content-Encoding gzip;
        the control plane enforces an 8 MiB compressed-wire cap and a 32 MiB decoded cap, verifies the
        purpose-bound Ed25519 signature and server-authoritative agent/host/asset/session identity, then
        persists events, delivery sequence provenance, gaps, and the highest-contiguous ACK atomically.
'''
          new_description = '''        Agent-authenticated A3 ingest. Delivery batches use application/json; durable agent-origin spool-loss
        evidence uses application/vnd.synapse.telemetry-gap+json. Either request may use Content-Encoding gzip.
        The control plane enforces an 8 MiB compressed-wire cap and a 32 MiB decoded cap, verifies the
        purpose-bound Ed25519 signature and server-authoritative agent/host/asset/session identity, then
        persists events or loss provenance before acknowledging it. Known-coordinate durable loss may advance
        the highest-contiguous ACK; unknown-coordinate loss remains queryable but cannot fabricate ACK progress.
'''
          if text.count(old_description) != 1:
              raise SystemExit(f"telemetry description anchor count={text.count(old_description)}, want 1")
          text = text.replace(old_description, new_description, 1)
          path.write_text(text)
      - name: Commit canonical contract
        shell: bash
        run: |
          if git diff --quiet -- api/openapi.yaml; then
            exit 0
          fi
          git config user.name "VietSory"
          git config user.email "121284939+VietSory@users.noreply.github.com"
          git add api/openapi.yaml
          git diff --cached --check
          git commit -m "docs(api): document signed telemetry gap transport"
          git push origin HEAD:feat/624-telemetry-transport-submission
