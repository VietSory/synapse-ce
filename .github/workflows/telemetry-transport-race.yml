name: Telemetry Transport Race

on:
  pull_request:
    paths:
      - "cmd/synapse-agent/**"
      - "cmd/synapse-api/main.go"
      - "cmd/synapse-api/telemetry_runtime*.go"
      - "api/openapi.yaml"
      - "internal/adapter/httpapi/fleet_telemetry*.go"
      - "internal/domain/fleetagent/**"
      - "internal/domain/telemetry/**"
      - "internal/domain/telemetryschema/**"
      - "internal/infrastructure/fleetclient/**"
      - "internal/infrastructure/persistence/memory/telemetry*.go"
      - "internal/infrastructure/persistence/postgres/telemetry*.go"
      - "internal/infrastructure/spool/**"
      - "internal/usecase/fleet/telemetry/**"
      - "internal/usecase/ports/telemetry_delivery.go"
      - "migrations/0109_telemetry_delivery.sql"
      - ".github/workflows/telemetry-transport-race.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    name: Finalize #624 production composition + OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          ref: feat/624-telemetry-transport
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply exact composition and API contract patch
        shell: python
        run: |
          from pathlib import Path

          main = Path("cmd/synapse-api/main.go")
          text = main.read_text()
          if "wireFleetTelemetry(router, databasePool, auditLog, clock, log)" not in text:
              old = "\t\trouter.SetFleet(agentSvc, workSvc, clock.Now, cfg.FleetClientCertHeader)\n\t\trouter.SetFleetAdmin(agentSvc)\n\n\t\t// Operator-controlled update rollout"
              new = "\t\trouter.SetFleet(agentSvc, workSvc, clock.Now, cfg.FleetClientCertHeader)\n\t\trouter.SetFleetAdmin(agentSvc)\n\t\tif terr := wireFleetTelemetry(router, databasePool, auditLog, clock, log); terr != nil {\n\t\t\tlog.Error(\"fleet telemetry transport init failed\", \"err\", terr)\n\t\t\tos.Exit(1)\n\t\t}\n\n\t\t// Operator-controlled update rollout"
              if old not in text:
                  raise SystemExit("main.go fleet composition anchor changed; refusing broad rewrite")
              main.write_text(text.replace(old, new, 1))

          spec = Path("api/openapi.yaml")
          text = spec.read_text()
          tag_anchor = "- name: assets\n  description: Business-level Asset Management and security posture\n"
          if "- name: fleet-telemetry\n" not in text:
              if tag_anchor not in text:
                  raise SystemExit("OpenAPI tag anchor changed")
              text = text.replace(tag_anchor, tag_anchor + "- name: fleet-telemetry\n  description: Authenticated agent signing-key registration and durable signed telemetry delivery\n", 1)
          path_anchor = "  /api/v1/engagements:\n"
          if "  /api/v1/fleet/signing-keys:\n" not in text:
              if path_anchor not in text:
                  raise SystemExit("OpenAPI path anchor changed")
              text = text.replace(path_anchor, r'''  /api/v1/fleet/signing-keys:
    post:
      tags: [fleet-telemetry]
      summary: Register the authenticated agent's telemetry signing key
      description: Registers an Ed25519 key for purpose-bound telemetry batches after proof of private-key possession; the server binds it to the authenticated canonical agent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [public_key, not_before, not_after, proof]
              properties:
                public_key: {type: string, format: byte, description: Base64-encoded 32-byte Ed25519 public key}
                not_before: {type: string, format: date-time}
                not_after: {type: string, format: date-time}
                proof: {type: string, description: Purpose-bound Ed25519 proof of private-key possession}
      responses:
        "201":
          description: Telemetry signing key registered
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [key_id, purpose, not_before, not_after]
                properties:
                  key_id: {type: string}
                  purpose: {type: string, enum: [telemetry_batch]}
                  not_before: {type: string, format: date-time}
                  not_after: {type: string, format: date-time}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {description: Registration conflicts with durable key state}
        "429": {description: Persistence saturated; retry according to Retry-After}
        "503": {description: Persistence temporarily unavailable; retry according to Retry-After}

  /api/v1/fleet/telemetry:
    post:
      tags: [fleet-telemetry]
      summary: Deliver a signed telemetry batch
      description: Accepts strict JSON, optionally gzip-compressed (8 MiB wire / 32 MiB decoded). The server verifies canonical agent/session/host/asset identity, purpose-bound signing key, schema and manifest commitments before idempotent durable ingest. ACK is the highest contiguous durable sequence for the stream epoch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [manifest, key_id, signature, payload]
              properties:
                manifest:
                  type: object
                  additionalProperties: false
                  required: [protocol_version, schema_version, batch_id, agent_id, host_id, agent_session_id, asset_id, stream_id, priority, epoch, sequence, previous_sequence, event_time_min, event_time_max, observed_count, kept_count, sampled_out_count, truncated_count, dropped_count, sampling_policy_digest, event_ids, event_digests, payload_digest]
                  properties:
                    protocol_version: {type: integer, enum: [1]}
                    schema_version: {type: integer, enum: [1, 2]}
                    batch_id: {type: string}
                    agent_id: {type: string}
                    host_id: {type: string}
                    agent_session_id: {type: string}
                    asset_id: {type: string}
                    stream_id: {type: string}
                    priority: {type: integer, minimum: 0, maximum: 3}
                    epoch: {type: integer, minimum: 1}
                    sequence: {type: integer, minimum: 1}
                    previous_sequence: {type: integer, minimum: 0}
                    event_time_min: {type: string, format: date-time}
                    event_time_max: {type: string, format: date-time}
                    observed_count: {type: integer, minimum: 1}
                    kept_count: {type: integer, minimum: 1}
                    sampled_out_count: {type: integer, minimum: 0}
                    truncated_count: {type: integer, minimum: 0}
                    dropped_count: {type: integer, minimum: 0}
                    sampling_policy_digest: {type: string, pattern: "^[0-9a-f]{64}$"}
                    event_ids: {type: array, minItems: 1, items: {type: string}}
                    event_digests: {type: array, minItems: 1, items: {type: string, pattern: "^[0-9a-f]{64}$"}}
                    payload_digest: {type: string, pattern: "^[0-9a-f]{64}$"}
                key_id: {type: string, minLength: 1}
                signature: {type: string, format: byte, description: Base64-encoded 64-byte Ed25519 signature}
                payload: {type: string, format: byte, description: Base64-encoded canonical uncompressed telemetry envelope array}
      responses:
        "200":
          description: Batch is durable; ACK identifies the highest contiguous persisted sequence
          content:
            application/json:
              schema:
                type: object
                required: [ack, new_events, gaps]
                properties:
                  ack:
                    type: object
                    required: [priority, epoch, through]
                    properties:
                      priority: {type: integer, minimum: 0, maximum: 3}
                      epoch: {type: integer, minimum: 1}
                      through: {type: integer, minimum: 0}
                  new_events: {type: integer, minimum: 0}
                  gaps:
                    type: array
                    description: Durable sequence gaps; gap objects currently retain legacy Go field casing.
                    items:
                      type: object
                      properties:
                        TenantID: {type: string}
                        HostID: {type: string}
                        AssetID: {type: string}
                        AgentID: {type: string}
                        AgentSessionID: {type: string}
                        StreamID: {type: string}
                        Priority: {type: integer, minimum: 0, maximum: 3}
                        Epoch: {type: integer, minimum: 1}
                        FromSequence: {type: integer, minimum: 1}
                        ToSequence: {type: integer, minimum: 1}
                        FromAt: {type: string, format: date-time}
                        ToAt: {type: string, format: date-time}
                        DetectedAt: {type: string, format: date-time}
                        ResolvedAt: {type: [string, "null"], format: date-time}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {description: Delivery conflicts with durable stream state}
        "429": {description: Persistence saturated; retry according to Retry-After}
        "503": {description: Persistence temporarily unavailable; retry according to Retry-After}

''' + path_anchor, 1)
          spec.write_text(text)
      - name: Focused validation
        run: |
          gofmt -w cmd/synapse-api/main.go
          go test ./api ./cmd/synapse-api ./internal/adapter/httpapi
          git diff --check
      - name: Commit clean final patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout HEAD^ -- .github/workflows/telemetry-transport-race.yml
          git rm -f .github/workflows/624-one-shot-patch.yml
          git add cmd/synapse-api/main.go api/openapi.yaml .github/workflows/telemetry-transport-race.yml
          git diff --cached --check
          git commit -m "feat(telemetry): wire production transport and document API"
          git push origin HEAD:feat/624-telemetry-transport

  race:
    name: Telemetry ingest + agent spool (-race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Race-sensitive telemetry transport tests
        run: >-
          go test -race -count=1
          ./internal/usecase/fleet/telemetry
          ./internal/infrastructure/spool
          ./cmd/synapse-agent
