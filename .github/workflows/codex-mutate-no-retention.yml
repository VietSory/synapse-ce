name: codex-mutate-no-retention
on:
  push:
    branches: [codex/402-mutation-no-retention]
permissions:
  contents: write
jobs:
  mutate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {ref: codex/402-mutation-no-retention}
      - name: Remove write-path retention guard
        shell: python
        run: |
          from pathlib import Path
          p=Path('internal/infrastructure/sourceartifact/store.go')
          s=p.read_text()
          start=s.index('func (s *Store) cleanupBeforeWrite(ctx context.Context) error {')
          end=s.index('\n}\n\nvar _ ports.ProjectSourceArtifactStore', start)+2
          s=s[:start]+'func (s *Store) cleanupBeforeWrite(context.Context) error { return nil }'+s[end:]
          p.write_text(s)
      - name: Commit mutation and remove helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          gofmt -w internal/infrastructure/sourceartifact/store.go
          git rm .github/workflows/codex-mutate-no-retention.yml
          git add internal/infrastructure/sourceartifact/store.go
          git commit -m 'MUTATION: disable source retention before writes'
          git push origin HEAD:codex/402-mutation-no-retention
