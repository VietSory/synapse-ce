name: One-shot #624 telemetry OpenAPI patch

on:
  push:
    branches: [feat/624-telemetry-transport]
    paths: [.github/workflows/624-openapi-telemetry.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/624-telemetry-transport
          fetch-depth: 0
      - name: Document telemetry agent-plane transport
        shell: python
        run: |
          from pathlib import Path

          path = Path("api/openapi.yaml")
          source = path.read_text()
          anchor = "  /api/v1/aup:\n"
          if source.count(anchor) != 1:
              raise SystemExit(f"expected exactly one OpenAPI insertion anchor, found {source.count(anchor)}")
          block = r'''  /api/v1/fleet/signing-keys:
    post:
      summary: Register an agent telemetry signing key
      description: >
        Agent-authenticated registration for a purpose-bound Ed25519 telemetry key. The control plane
        binds the key to the authenticated canonical AgentID and verifies proof of possession before
        persistence. Unknown JSON fields and trailing JSON values are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [public_key, not_before, not_after, proof]
              properties:
                public_key: {type: string, format: byte, description: Base64-encoded 32-byte Ed25519 public key}
                not_before: {type: string, format: date-time}
                not_after: {type: string, format: date-time}
                proof: {type: string, description: Ed25519 proof-of-possession value for this key registration}
      responses:
        "201":
          description: Telemetry signing key registered
          content:
            application/json:
              schema:
                type: object
                required: [key_id, purpose, not_before, not_after]
                properties:
                  key_id: {type: string}
                  purpose: {type: string, const: telemetry_batch}
                  not_before: {type: string, format: date-time}
                  not_after: {type: string, format: date-time}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {description: Signing-key registration conflicts with existing state}
        "429":
          description: Telemetry key service is saturated; retry after the advertised delay
          headers:
            Retry-After: {schema: {type: string}}
        "503":
          description: Telemetry key service is temporarily unavailable
          headers:
            Retry-After: {schema: {type: string}}

  /api/v1/fleet/telemetry:
    post:
      summary: Ingest a signed telemetry delivery batch
      description: >
        Agent-authenticated A3 ingest. The request may be sent as raw JSON or Content-Encoding gzip;
        the control plane enforces an 8 MiB compressed-wire cap and a 32 MiB decoded cap, verifies the
        purpose-bound Ed25519 signature and server-authoritative agent/host/asset/session identity, then
        persists events, delivery sequence provenance, gaps, and the highest-contiguous ACK atomically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [manifest, key_id, signature, payload]
              properties:
                manifest:
                  type: object
                  additionalProperties: false
                  required: [protocol_version, schema_version, batch_id, agent_id, host_id, agent_session_id, asset_id, stream_id, priority, epoch, sequence, previous_sequence, event_time_min, event_time_max, observed_count, kept_count, sampled_out_count, truncated_count, dropped_count, sampling_policy_digest, event_ids, event_digests, payload_digest]
                  properties:
                    protocol_version: {type: integer, const: 1}
                    schema_version: {type: integer, minimum: 1}
                    batch_id: {type: string, minLength: 1}
                    agent_id: {type: string, minLength: 1}
                    host_id: {type: string, minLength: 1}
                    agent_session_id: {type: string, minLength: 1}
                    asset_id: {type: string, minLength: 1}
                    stream_id: {type: string, minLength: 1}
                    priority: {type: integer, minimum: 0}
                    epoch: {type: integer, minimum: 1}
                    sequence: {type: integer, minimum: 1}
                    previous_sequence: {type: integer, minimum: 0}
                    event_time_min: {type: string, format: date-time}
                    event_time_max: {type: string, format: date-time}
                    observed_count: {type: integer, minimum: 1}
                    kept_count: {type: integer, minimum: 1}
                    sampled_out_count: {type: integer, minimum: 0}
                    truncated_count: {type: integer, minimum: 0}
                    dropped_count: {type: integer, minimum: 0}
                    sampling_policy_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
                    event_ids: {type: array, minItems: 1, items: {type: string, minLength: 1}}
                    event_digests: {type: array, minItems: 1, items: {type: string, pattern: '^[0-9a-f]{64}$'}}
                    payload_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
                key_id: {type: string, minLength: 1}
                signature: {type: string, format: byte, description: Base64-encoded Ed25519 signature}
                payload: {type: string, format: byte, description: Base64-encoded canonical uncompressed JSON telemetry-envelope array}
      responses:
        "200":
          description: Batch durably ingested or idempotently replayed
          content:
            application/json:
              schema:
                type: object
                required: [ack, new_events, gaps]
                properties:
                  ack:
                    type: object
                    required: [priority, epoch, through]
                    properties:
                      priority: {type: integer, minimum: 0}
                      epoch: {type: integer, minimum: 1}
                      through: {type: integer, minimum: 0}
                  new_events: {type: integer, minimum: 0}
                  gaps:
                    type: array
                    description: Unresolved durable delivery gaps; gap objects retain legacy Go field names.
                    items: {type: object, additionalProperties: true}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {description: Delivery coordinates conflict with already persisted content}
        "429":
          description: Telemetry ingest is saturated; the batch was not ACKed and must be retried
          headers:
            Retry-After: {schema: {type: string}}
        "503":
          description: Telemetry ingest is temporarily unavailable; the batch was not ACKed and must be retried
          headers:
            Retry-After: {schema: {type: string}}

'''
          path.write_text(source.replace(anchor, block + anchor, 1))
      - name: Commit canonical API contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/openapi.yaml
          git diff --cached --check
          git commit -m "docs(api): specify telemetry transport endpoints"
          git push origin HEAD:feat/624-telemetry-transport
