name: D3 branch helper

on:
  push:
    branches:
      - feat/scanner-edge-scope

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/scanner-edge-scope
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Apply D3.3 patch
        run: python3 .github/scripts/d3_patch.py

      - name: Format D3.3 files
        run: gofmt -w internal/infrastructure/tools/ownsbom/conan_test.go internal/infrastructure/tools/ownsbom/npm.go internal/infrastructure/tools/ownsbom/pnpm.go internal/infrastructure/tools/ownsbom/pnpm_test.go internal/usecase/sca/service.go internal/usecase/sca/dependency_scope_test.go

      - name: Run targeted D3.3 tests
        run: go test -count=1 ./internal/domain/sbom ./internal/infrastructure/tools/ownsbom ./internal/usecase/sca ./internal/usecase/projectuc

      - name: Commit validated patch
        shell: bash
        run: |
          if git diff --quiet --exit-code && [ -z "$(git status --porcelain)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/infrastructure/tools/ownsbom/conan_test.go internal/infrastructure/tools/ownsbom/npm.go internal/infrastructure/tools/ownsbom/pnpm.go internal/infrastructure/tools/ownsbom/pnpm_test.go internal/usecase/sca/service.go internal/usecase/sca/dependency_scope_test.go
          git commit -m "feat(sca): validate dependency edge scope"
          git push origin HEAD:feat/scanner-edge-scope
