name: temporary-1121-branch-build

on:
  push:
    branches:
      - feat/1121-pr-decoration-foundation

permissions:
  contents: write

jobs:
  patch-test-and-clean:
    if: github.event.head_commit.message != 'feat(cq): wire PR decoration completion triggers'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply narrow #1121 edits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          service = Path('internal/usecase/projectuc/service.go')
          text = service.read_text()
          old = '\tprofiles                         *qualityprofilesuc.Service\n\tallowLocalSource                 bool\n'
          new = '\tprofiles                         *qualityprofilesuc.Service\n\tdecorator                        ports.PRDecorator\n\tallowLocalSource                 bool\n'
          assert text.count(old) == 1, 'Service field anchor changed'
          text = text.replace(old, new, 1)

          old = 'func (s *Service) SetQualityGateMutator(mutator ports.QualityGateMutator) { s.gateMutator = mutator }\n'
          new = old + 'func (s *Service) SetPRDecorator(decorator ports.PRDecorator)              { s.decorator = decorator }\n'
          assert text.count(old) == 1, 'Service setter anchor changed'
          text = text.replace(old, new, 1)

          old = '\t} else if err := s.analyses.SaveWithResult(ctx, analysis, data); err != nil {\n\t\treturn fmt.Errorf("save project analysis: %w", err)\n\t}\n\treturn nil\n}\n\n// ListHotspots'
          new = '\t} else if err := s.analyses.SaveWithResult(ctx, analysis, data); err != nil {\n\t\treturn fmt.Errorf("save project analysis: %w", err)\n\t}\n\ts.decorateProjectAnalysis(ctx, analysis)\n\treturn nil\n}\n\n// ListHotspots'
          assert text.count(old) == 1, 'recordProjectAnalysis tail anchor changed'
          text = text.replace(old, new, 1)
          service.write_text(text)

          main = Path('cmd/synapse-cli/main.go')
          text = main.read_text()
          run_start = text.index('func runGate(')
          render_start = text.index('func printGateMarkdown(', run_start)
          run = text[run_start:render_start]
          old = '\tif markdown {\n\t\tprintGateMarkdown(dir, scopeLabel, rep, dupRep.Density(), covLabel, result)\n'
          new = '\tsummary := qualitygate.RenderMarkdown(scopeLabel, rep, dupRep.Density(), covLabel, result)\n\tif markdown {\n\t\tfmt.Print(summary)\n'
          assert run.count(old) == 1, 'runGate markdown anchor changed'
          run = run.replace(old, new, 1)
          gate_check = '\tif !result.Passed {\n'
          idx = run.rfind(gate_check)
          assert idx >= 0, 'runGate result anchor changed'
          run = run[:idx] + '\ttriggerGateDecorationFromEnv(ctx, cliPRDecorator, result, summary, scoped)\n' + run[idx:]
          text = text[:run_start] + run + text[render_start:]

          render_start = text.index('func printGateMarkdown(')
          next_func = text.index('func filterNewCode(', render_start)
          text = text[:render_start] + text[next_func:]
          main.write_text(text)
          PY
          gofmt -w \
            cmd/synapse-cli/main.go \
            cmd/synapse-cli/push.go \
            cmd/synapse-cli/pr_decoration.go \
            cmd/synapse-cli/pr_decoration_test.go \
            cmd/synapse-cli/pr_identity_test.go \
            internal/domain/projectanalysis/origin.go \
            internal/domain/qualitygate/markdown.go \
            internal/domain/qualitygate/markdown_test.go \
            internal/usecase/ports/pr_decorator.go \
            internal/usecase/projectuc/service.go \
            internal/usecase/projectuc/decoration.go \
            internal/usecase/projectuc/decoration_test.go
      - name: Targeted tests
        run: go test ./internal/domain/qualitygate ./internal/domain/projectanalysis ./internal/usecase/ports ./internal/usecase/projectuc ./cmd/synapse-cli
      - name: Build all commands without CGO
        env:
          CGO_ENABLED: '0'
        run: go build ./cmd/...
      - name: Vet
        run: go vet ./...
      - name: Commit verified patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/zz-1121-branch-build.yml
          git config user.name 'VietSory'
          git config user.email '121284939+VietSory@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(cq): wire PR decoration completion triggers'
          git push origin HEAD:feat/1121-pr-decoration-foundation
