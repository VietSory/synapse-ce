name: PR1500 exact-head follow-up

on:
  push:
    branches: [ci/1500-exact-head-followup]

permissions:
  contents: read

jobs:
  targeted:
    name: Exact-head targeted race + non-Postgres full Go
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${{ github.run_id }}
      POSTGRES_DB: synapse
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: synapse
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d synapse"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Configure PostgreSQL integration DSN
        run: echo "SYNAPSE_TEST_DB_DSN=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/${POSTGRES_DB}?sslmode=disable" >> "$GITHUB_ENV"
      - name: HTTP webhook race
        run: go test -race -p 1 -count=1 -run '^TestInboundWebhook' ./internal/adapter/httpapi
      - name: PostgreSQL webhook migration/runtime race
        run: go test -race -p 1 -count=1 -run '^(TestMigration0199InboundWebhookPlane|TestInboundWebhookHostilePostgresRuntimeRole)$' ./internal/infrastructure/persistence/postgres
      - name: Full Go except known-baseline PostgreSQL package
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t pkgs < <(go list ./... | grep -v '/internal/infrastructure/persistence/postgres$')
          go test -p 1 -count=1 "${pkgs[@]}"
