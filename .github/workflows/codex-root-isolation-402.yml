name: Codex 402 source root isolation

on:
  push:
    branches:
      - codex/402-sanctioned-source-publish

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact capture isolation guard
        shell: python
        run: |
          from pathlib import Path
          p = Path("internal/infrastructure/sourceartifact/store.go")
          text = p.read_text()
          old = '\tif err := s.validateWriteRoot(); err != nil {\n\t\treturn unavailable(projectanalysis.UnavailableCaptureFailed), err\n\t}\n\tif err := ctx.Err(); err != nil {\n'
          new = '\tif err := s.validateSourceIsolation(sourceDir); err != nil {\n\t\treturn unavailable(projectanalysis.UnavailableCaptureFailed), err\n\t}\n\tif err := s.validateWriteRoot(); err != nil {\n\t\treturn unavailable(projectanalysis.UnavailableCaptureFailed), err\n\t}\n\tif err := ctx.Err(); err != nil {\n'
          if text.count(old) != 1:
              raise SystemExit(f"expected one Capture root anchor, found {text.count(old)}")
          p.write_text(text.replace(old, new, 1))
      - name: Format and verify
        run: |
          gofmt -w internal/infrastructure/sourceartifact/store.go
          git diff --check
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/infrastructure/sourceartifact/store.go
          git diff --cached --quiet && exit 0
          git commit -m "fix(appsec): isolate source artifacts from scanned tree"
          git push origin HEAD:codex/402-sanctioned-source-publish
