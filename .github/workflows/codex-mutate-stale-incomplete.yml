name: codex-mutate-stale-incomplete
on:
  push:
    branches: [codex/402-mutation-stale-incomplete]
permissions:
  contents: write
jobs:
  mutate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {ref: codex/402-mutation-stale-incomplete}
      - name: Restore manifest-less cleanup bypass
        shell: python
        run: |
          from pathlib import Path
          p=Path('internal/infrastructure/sourceartifact/store.go')
          s=p.read_text()
          old='''\t\t\t\tif _, err := os.Stat(filepath.Join(analysisDir, "manifest.json")); err != nil && !os.IsNotExist(err) {
          \t\t\t\t\treturn fmt.Errorf("stat source artifact manifest: %w", err)
          \t\t\t\t}
          \t\t\t\t// A process may die after atomically claiming the analysis directory but before
          \t\t\t\t// writing manifest.json. Treat an old manifest-less claim as managed stale state
          \t\t\t\t// so it cannot block publication forever.
          \t\t\t\tif info.ModTime().Before(before) {'''
          new='''\t\t\t\tif _, err := os.Stat(filepath.Join(analysisDir, "manifest.json")); os.IsNotExist(err) {
          \t\t\t\t\tcontinue
          \t\t\t\t} else if err != nil {
          \t\t\t\t\treturn fmt.Errorf("stat source artifact manifest: %w", err)
          \t\t\t\t}
          \t\t\t\tif info.ModTime().Before(before) {'''
          if s.count(old)!=1:
              raise SystemExit(f'expected one cleanup guard, got {s.count(old)}')
          p.write_text(s.replace(old,new,1))
      - name: Commit mutation and remove helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          gofmt -w internal/infrastructure/sourceartifact/store.go
          git rm .github/workflows/codex-mutate-stale-incomplete.yml
          git add internal/infrastructure/sourceartifact/store.go
          git commit -m 'MUTATION: skip stale incomplete source claims'
          git push origin HEAD:codex/402-mutation-stale-incomplete
