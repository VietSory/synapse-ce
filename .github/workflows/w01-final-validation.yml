name: W01 final security validation

on:
  push:
    branches: [ci/1434-final-validation]

permissions:
  contents: read

jobs:
  backend:
    name: Backend Linux + PostgreSQL 17
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${{ github.run_id }}
      POSTGRES_DB: synapse
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: synapse
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d synapse"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting and whitespace
        run: |
          test -z "$(gofmt -l             cmd/synapse-api/main.go             internal/platform/config/config.go             internal/usecase/ports/inbound_webhook.go             internal/usecase/capabilities/service.go             internal/usecase/capabilities/service_test.go             internal/adapter/httpapi/router.go             internal/adapter/httpapi/auth_paths_test.go             internal/adapter/httpapi/capability_handler_test.go             internal/adapter/httpapi/harness_test.go             internal/adapter/httpapi/inbound_webhook.go             internal/adapter/httpapi/inbound_webhook_test.go             internal/infrastructure/persistence/postgres/db.go             internal/infrastructure/persistence/postgres/inbound_webhook.go             internal/infrastructure/persistence/postgres/migration_0199_test.go)"
          git diff --check
          test -z "$(git status --porcelain)"
      - name: Configure PostgreSQL integration DSN
        run: echo "SYNAPSE_TEST_DB_DSN=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/${POSTGRES_DB}?sslmode=disable" >> "$GITHUB_ENV"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Focused webhook + PostgreSQL
        run: go test -p 1 -count=1 ./internal/adapter/httpapi ./internal/infrastructure/persistence/postgres
      - name: Targeted race
        run: go test -race -p 1 -count=1 ./internal/adapter/httpapi ./internal/infrastructure/persistence/postgres
      - name: Full Go
        run: go test -p 1 -count=1 ./...
      - name: CGO-disabled commands
        run: CGO_ENABLED=0 go build ./cmd/...

  backend-windows:
    name: Backend Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test -p 1 -count=1 ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run typecheck
      - run: pnpm build

  docs:
    name: Strict MkDocs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict

  lint:
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
