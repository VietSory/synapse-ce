name: Stage PR 779 rebase (current main)

on:
  push:
    branches: [ci/pr-779-stage-rebase]
  workflow_dispatch:
  pull_request:
    branches: [ci/pr-779-stage-rebase]

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Rebase PR 779 onto current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main feat/708-a2a-scan-run-provenance
          git checkout -B pr-779-candidate origin/feat/708-a2a-scan-run-provenance

          if ! GIT_EDITOR=true git rebase origin/main; then
            while test -d .git/rebase-merge || test -d .git/rebase-apply; do
              mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
              printf '%s\n' "${conflicts[@]}"
              if test "${#conflicts[@]}" -eq 0; then
                exit 1
              fi
              for path in "${conflicts[@]}"; do
                case "${path}" in
                  CHANGELOG.md)
                    git show :3:CHANGELOG.md > /tmp/pr779-changelog.md
                    git checkout --ours CHANGELOG.md
                    python3 - <<'PY'
          from pathlib import Path
          import re
          feature = Path("/tmp/pr779-changelog.md").read_text()
          base = Path("CHANGELOG.md").read_text()
          match = re.search(r"(?ms)^- \*\*Scan runs now support tenant-owned, sealed provenance v1\.\*\*.*?(?=^- \*\*|\Z)", feature)
          if not match:
              raise SystemExit("scan-run changelog entry not found in feature side")
          entry = match.group(0).rstrip() + "\n\n"
          marker = "### Added\n\n"
          if marker not in base:
              raise SystemExit("Unreleased Added section not found")
          if entry not in base:
              base = base.replace(marker, marker + entry, 1)
          Path("CHANGELOG.md").write_text(base)
          PY
                    ;;
                  migrations/0134_scan_run_provenance.sql)
                    git show :3:migrations/0134_scan_run_provenance.sql > migrations/0138_scan_run_provenance.sql
                    git checkout --ours migrations/0134_scan_run_provenance.sql
                    sed -i 's/0134/0138/g' migrations/0138_scan_run_provenance.sql
                    ;;
                  internal/infrastructure/persistence/postgres/migration_0134_test.go)
                    git show :3:internal/infrastructure/persistence/postgres/migration_0134_test.go > internal/infrastructure/persistence/postgres/migration_0138_test.go
                    git checkout --ours internal/infrastructure/persistence/postgres/migration_0134_test.go
                    sed -i -e 's/0134/0138/g' -e 's/DownTo(133)/DownTo(137)/g' -e 's/UpTo(134)/UpTo(138)/g' internal/infrastructure/persistence/postgres/migration_0138_test.go
                    ;;
                  *)
                    echo "Unexpected rebase conflict: ${path}" >&2
                    exit 1
                    ;;
                esac
              done
              git add -A
              GIT_EDITOR=true git rebase --continue || true
            done
          fi

          if test -e migrations/0134_scan_run_provenance.sql; then
            git mv migrations/0134_scan_run_provenance.sql migrations/0138_scan_run_provenance.sql
            sed -i 's/0134/0138/g' migrations/0138_scan_run_provenance.sql
            git commit -m "chore(scanrun): renumber provenance migration after rebase"
          fi
          test -e migrations/0138_scan_run_provenance.sql
          python3 - <<'PY'
          from pathlib import Path
          import re
          seen = {}
          for p in Path("migrations").glob("*.sql"):
              m = re.match(r"^(\d+)_", p.name)
              if not m:
                  continue
              seen.setdefault(m.group(1), []).append(p.name)
          duplicates = {n: names for n, names in seen.items() if len(names) > 1}
          if duplicates:
              raise SystemExit(f"duplicate migration versions: {duplicates}")
          PY
          git diff --check origin/main...HEAD
          git push --force-with-lease origin HEAD:refs/heads/codex/pr-779-candidate

  validate-candidate:
    needs: rebase
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: synapse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d synapse_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SYNAPSE_TEST_DB_DSN: postgres://postgres:postgres@localhost:5432/synapse_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pr-779-candidate
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and vet
        run: |
          go build ./...
          go vet ./...
      - name: Validate scan-run domain and service
        run: |
          go test ./internal/domain/scanrun ./internal/usecase/scanrun ./internal/infrastructure/persistence/memory -count=1
      - name: Validate Postgres 17 migration and store contracts
        run: |
          go test ./internal/infrastructure/persistence/postgres -count=1 -run '^(TestMigration0138ProductionOwnerPath|TestMigrationInventoryNoDuplicateGooseVersions|TestPostgresScanRunStore|TestScanRunStore)'
      - name: Run full Go suite
        run: go test ./... -count=1
      - name: Build without CGO
        run: CGO_ENABLED=0 go build ./cmd/...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate frontend
        working-directory: web
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm test --run
          pnpm typecheck
          pnpm build
