name: Secret parity final validation

on:
  push:
    branches:
      - ci/secret-parity-final-validation

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ci/secret-parity-final-validation
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply final acceptance patch
        run: python3 .github/scripts/secret_parity_atlassian_patch.py
      - name: Format
        run: gofmt -w internal/infrastructure/tools/secretscan/parity_rules.go internal/infrastructure/tools/secretscan/parity_rules_test.go internal/infrastructure/rulecatalog/secrets_parity.go
      - name: Test secret detector and catalog suites
        run: go test -count=1 ./internal/infrastructure/tools/secretscan ./internal/infrastructure/rulecatalog
      - name: Vet
        run: go vet ./internal/infrastructure/tools/secretscan ./internal/infrastructure/rulecatalog
      - name: Commit validated files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md internal/infrastructure/tools/secretscan/parity_rules.go internal/infrastructure/tools/secretscan/parity_rules_test.go internal/infrastructure/rulecatalog/secrets_parity.go internal/infrastructure/rulecatalog/testdata/rule_keys.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test(secrets): validate Atlassian parity coverage"
          git push origin HEAD:ci/secret-parity-final-validation
