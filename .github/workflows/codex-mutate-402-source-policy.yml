name: Codex 402 mutate source policy

on:
  push:
    branches:
      - codex/402-mutation-source-policy

permissions:
  contents: write

jobs:
  mutate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/402-mutation-source-policy
      - name: Remove credential and state exclusions
        shell: python
        run: |
          from pathlib import Path
          p = Path("internal/domain/sourcepolicy/policy.go")
          text = p.read_text()
          start = text.index('func RetainPath(p string) bool {')
          replacement = '''func RetainPath(p string) bool {\n\tcanonical, err := measure.CanonicalPath(p)\n\treturn err == nil && canonical != "" && canonical == p\n}\n'''
          p.write_text(text[:start] + replacement)
      - name: Commit mutation and remove helper
        run: |
          gofmt -w internal/domain/sourcepolicy/policy.go
          rm .github/workflows/codex-mutate-402-source-policy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/domain/sourcepolicy/policy.go .github/workflows/codex-mutate-402-source-policy.yml
          git commit -m "test(mutation): allow secret and state source paths"
          git push
