name: Codex 402 mutate durable audit

on:
  push:
    branches:
      - codex/402-mutation-no-audit

permissions:
  contents: write

jobs:
  mutate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/402-mutation-no-audit
      - name: Remove durable audit append
        shell: python
        run: |
          from pathlib import Path
          path = Path("internal/infrastructure/persistence/postgres/project_analysis_source.go")
          text = path.read_text()
          old = '''\tif err := appendAudit(ctx, tx, audit); err != nil {\n\t\treturn err\n\t}\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one audit append, found {text.count(old)}")
          path.write_text(text.replace(old, ""))
      - name: Commit mutation and remove helper
        run: |
          rm .github/workflows/codex-mutate-402-no-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/infrastructure/persistence/postgres/project_analysis_source.go .github/workflows/codex-mutate-402-no-audit.yml
          git commit -m "test(mutation): remove source publish audit append"
          git push
