name: Telemetry Tail CI

on:
  pull_request:
    branches:
      - ci/624-canonical-base

permissions:
  contents: read

jobs:
  telemetry-linux:
    name: Telemetry tail (Linux + Postgres + race)
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${{ github.run_id }}
      POSTGRES_DB: synapse
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: synapse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d synapse"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Configure Postgres
        run: echo "SYNAPSE_TEST_DB_DSN=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/${POSTGRES_DB}?sslmode=disable" >> "$GITHUB_ENV"
      - name: Build all Go packages
        run: go build ./...
      - name: Vet telemetry surfaces
        run: >-
          go vet
          ./internal/domain/fleetagent
          ./internal/usecase/fleet/telemetryingest
          ./internal/infrastructure/fleetclient
          ./internal/infrastructure/persistence/memory
          ./internal/infrastructure/persistence/postgres
          ./internal/infrastructure/spool
          ./internal/adapter/httpapi
          ./cmd/synapse-agent
      - name: Focused telemetry tests
        run: >-
          go test -count=1
          ./internal/domain/fleetagent
          ./internal/usecase/fleet/telemetryingest
          ./internal/infrastructure/fleetclient
          ./internal/infrastructure/persistence/memory
          ./internal/infrastructure/spool
          ./internal/adapter/httpapi
          ./cmd/synapse-agent
      - name: PostgreSQL telemetry acceptance
        run: go test -count=1 ./internal/infrastructure/persistence/postgres -run '^TestTelemetryTransportRepository$'
      - name: Race gate
        run: >-
          go test -race -count=1
          ./internal/usecase/fleet/telemetryingest
          ./internal/infrastructure/spool
          ./cmd/synapse-agent

  telemetry-windows:
    name: Telemetry tail (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build all Go packages
        run: go build ./...
      - name: Focused tests
        run: go test -count=1 ./internal/domain/fleetagent ./internal/usecase/fleet/telemetryingest ./internal/infrastructure/fleetclient ./cmd/synapse-agent
