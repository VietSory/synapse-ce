name: One-shot #624 telemetry OpenAPI retry

on:
  push:
    branches: [feat/624-telemetry-transport]
    paths: [.github/workflows/624-openapi-retry.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/624-telemetry-transport
          fetch-depth: 0
      - name: Apply canonical telemetry API contract
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          path = Path("api/openapi.yaml")
          source = path.read_text()
          if "  /api/v1/fleet/telemetry:\n" in source and "  /api/v1/fleet/signing-keys:\n" in source:
              raise SystemExit(0)
          historical = subprocess.check_output([
              "git", "show", "a7a708f0a2eeb32a59bc297134602c867b881d1b:.github/workflows/624-openapi-telemetry.yml"
          ], text=True)
          marker = "          block = r'''"
          start = historical.index(marker) + len(marker)
          end = historical.index("\n'''\n          path.write_text", start)
          block = historical[start:end]
          anchor = "  /api/v1/aup:\n"
          if source.count(anchor) != 1:
              raise SystemExit(f"expected one OpenAPI anchor, found {source.count(anchor)}")
          path.write_text(source.replace(anchor, block + anchor, 1))
      - name: Commit canonical API contract
        run: |
          if git diff --quiet -- api/openapi.yaml; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/openapi.yaml
          git diff --cached --check
          git commit -m "docs(api): specify telemetry transport endpoints"
          git push origin HEAD:feat/624-telemetry-transport
