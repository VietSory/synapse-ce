name: Azure #1455 public live-API evidence

on:
  push:
    branches: [evidence/1455-public-azure-smoke]

permissions:
  contents: read

jobs:
  azure-public-evidence:
    name: Public Azure API and repository contract proof
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/1455-azure-pipelines-provider
          persist-credentials: false

      - name: Go provider and CLI contract tests on feature branch
        run: go test -count=1 -v ./internal/infrastructure/integration/azurepipelines ./cmd/synapse-cli

      - name: Read public Azure DevOps definitions and builds without credentials
        shell: bash
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import datetime
          import json
          import os
          import ssl
          import urllib.error
          import urllib.parse
          import urllib.request

          # The probe uses two KNOWN PUBLIC third-party projects, never a
          # tenant secret. A 200 JSON response is required for live evidence.
          projects = [("azure-sdk", "public"), ("dnceng", "public")]
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          rows = []
          live = None
          for organization, project in projects:
              origin = "https://dev.azure.com/" + organization + "/" + project
              row = {"organization": organization, "project": project}
              url = origin + "/_apis/build/definitions?" + urllib.parse.urlencode({"api-version":"7.1", "$top":"3"})
              try:
                  req = urllib.request.Request(url, headers={"Accept": "application/json", "User-Agent": "synapse-issue-1455-public-evidence"})
                  with opener.open(req, timeout=20) as response:
                      if response.getcode() != 200:
                          raise ValueError("definitions not 200")
                      raw = response.read(262145)
                      if len(raw)>262144:
                          raise ValueError("definitions response too large")
                      payload = json.loads(raw)
                      if not isinstance(payload,dict) or not isinstance(payload.get("value"),list):
                          raise ValueError("definitions response is not an API JSON page")
                      definitions = [{"id":x.get("id"),"name":x.get("name")} for x in payload["value"] if isinstance(x,dict) and isinstance(x.get("id"),int) and x["id"]>0]
                      row["definitions_http"] = 200
                      row["definition_count_on_first_page"] = len(definitions)
                      row["definitions"] = definitions[:3]
                      if definitions:
                          identifier = definitions[0]["id"]
                          builds_url = origin + "/_apis/build/builds?" + urllib.parse.urlencode({"api-version":"7.1", "definitions":str(identifier), "$top":"3", "queryOrder":"queueTimeDescending"})
                          builds_req = urllib.request.Request(builds_url, headers={"Accept":"application/json"})
                          with opener.open(builds_req,timeout=20) as builds_response:
                              data = builds_response.read(262145)
                              if builds_response.getcode() != 200 or len(data)>262144:
                                  raise ValueError("builds HTTP not 200 or response too large")
                              builds = json.loads(data)
                              if not isinstance(builds,dict) or not isinstance(builds.get("value"),list):
                                  raise ValueError("builds not an API JSON page")
                              row["builds_http"] = 200
                              row["builds"] = [{"id":x.get("id"),"status":x.get("status"),"result":x.get("result"),"definition_id":x.get("definition",{}).get("id")} for x in builds["value"][:3] if isinstance(x,dict)]
                              if row["builds"]:
                                  with open("evidence/live_web_url.txt","w") as f:
                                      f.write(origin+"/_build/results?buildId="+str(row["builds"][0]["id"])+"\n")
                      if live is None and row.get("builds"):
                          live=row
                      # Probe public recent runs independently: the first discovered
                      # definition may exist but have no builds.
                      try:
                          latest_url = origin + "/_apis/build/builds?" + urllib.parse.urlencode({"api-version":"7.1", "$top":"3", "queryOrder":"queueTimeDescending"})
                          latest_req = urllib.request.Request(latest_url, headers={"Accept":"application/json"})
                          with opener.open(latest_req, timeout=20) as latest_response:
                              latest_raw = latest_response.read(262145)
                              if latest_response.getcode()!=200 or len(latest_raw)>262144:
                                  raise ValueError("recent builds response invalid")
                              latest = json.loads(latest_raw)
                              if not isinstance(latest,dict) or not isinstance(latest.get("value"),list):
                                  raise ValueError("recent builds JSON invalid")
                              row["recent_builds_http"]=200
                              row["recent_builds"]=[{"id":b["id"],"status":b.get("status"),"result":b.get("result"),"definition_id":b.get("definition",{}).get("id")} for b in latest["value"][:3] if isinstance(b,dict) and isinstance(b.get("id"),int) and b["id"]>0]
                              if row["recent_builds"] and live is None:
                                  live=row
                                  with open("evidence/live_web_url.txt","w") as f:
                                      f.write(origin+"/_build/results?buildId="+str(row["recent_builds"][0]["id"])+"\n")
                      except Exception as e:
                          row["recent_builds_status"]=type(e).__name__+"; no actual run claim"
              except urllib.error.HTTPError as e:
                  row["status"]="HTTP "+str(e.code)+"; no live claim"
              except Exception as e:
                  row["status"]=type(e).__name__+"; no live claim"
              rows.append(row)
          result={
              "source":"uncredentialed public Azure DevOps Build API v7.1",
              "date_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "feature_commit":os.popen("git rev-parse HEAD").read().strip(),
              "actual_live_public_read":live is not None,
              "projects":rows,
              "limitation":"Anonymous public API exercise does not verify an authenticated PAT or a private tenant integration.",
          }
          with open("evidence/public-azure-api.json","w") as f:
              json.dump(result,f,indent=2,ensure_ascii=False)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("## #1455 live public Azure API probe\n\n")
              f.write("Actual public API definitions + observed run: **"+("PASS" if live else "NOT VERIFIED")+"**.\n\n")
              f.write("This is an anonymous real-service probe, not an authenticated PAT or private-tenant E2E test.\n\n")
              for row in rows:
                  f.write("- "+row["organization"]+"/"+row["project"]+": definitions "+str(row.get("definitions_http", row.get("status")))+", builds "+str(row.get("builds_http","not tested"))+", first-page definitions "+str(row.get("definition_count_on_first_page",0))+", unfiltered actual runs "+str(len(row.get("recent_builds",[])))+".\n")
              f.write("\nAll response bodies are bounded and only stable public IDs/statuses are retained in the artifact.\n")
          print(json.dumps(result, indent=2))
          PY

      - name: Exercise actual Synapse adapter against public Azure Build API
        shell: bash
        run: |
          cat > internal/infrastructure/integration/azurepipelines/live_public_evidence_test.go <<'GO'
          package azurepipelines

          import (
              "context"
              "encoding/json"
              "fmt"
              "net/http"
              "net/url"
              "os"
              "strconv"
              "testing"
              "time"

              "github.com/KKloudTarus/synapse-ce/internal/domain/integration"
              "github.com/KKloudTarus/synapse-ce/internal/domain/shared"
          )

          // Only in this temporary public-resource smoke test: real endpoints,
          // real adapter and SSRF-safe transport, but deliberately no live PAT.
          // The production code's Basic PAT handling is covered separately by
          // its contract tests; this does not claim tenant-authenticated E2E.
          type liveAnonymousTransport struct{ inner http.RoundTripper }
          func (a liveAnonymousTransport) RoundTrip(r *http.Request) (*http.Response, error) {
              copy := r.Clone(r.Context())
              copy.Header = r.Header.Clone()
              copy.Header.Del("Authorization")
              return a.inner.RoundTrip(copy)
          }

          func TestLivePublicAzureProvider(t *testing.T) {
              raw, err := os.ReadFile(os.Getenv("AZURE_EVIDENCE_FILE"))
              if err != nil { t.Fatal(err) }
              var evidence struct {
                  Projects []struct {
                      Organization string `json:"organization"`
                      Project string `json:"project"`
                      RecentBuilds []struct {
                          ID int64 `json:"id"`
                          DefinitionID int64 `json:"definition_id"`
                      } `json:"recent_builds"`
                  } `json:"projects"`
              }
              if err := json.Unmarshal(raw, &evidence); err != nil { t.Fatal(err) }
              var endpoint string
              var expectedBuildID, expectedDefinitionID int64
              for _, project := range evidence.Projects {
                  if len(project.RecentBuilds) > 0 && project.RecentBuilds[0].ID > 0 && project.RecentBuilds[0].DefinitionID > 0 {
                      endpoint = "https://dev.azure.com/" + project.Organization + "/" + project.Project
                      expectedBuildID = project.RecentBuilds[0].ID
                      expectedDefinitionID = project.RecentBuilds[0].DefinitionID
                      break
                  }
              }
              if endpoint == "" {
                  t.Skip("public API returned no actual run; cannot claim a live provider result")
              }
              item := integration.Integration{
                  ID: shared.ID("public-probe"), TenantID: shared.ID("public-probe"),
                  Provider: Provider, Endpoint: endpoint, Name: "public live probe", Version: 1,
              }
              instance, err := New(item, integration.CredentialBundle{"pat":"synthetic-public-probe-never-sent"})
              if err != nil { t.Fatal(err) }
              adapter := instance.(*Adapter)
              defer adapter.Close()
              adapter.client.Transport = liveAnonymousTransport{inner: adapter.client.Transport}
              ctx, cancel := context.WithTimeout(context.Background(), 75*time.Second)
              defer cancel()
              if err := adapter.TestConnection(ctx); err != nil { t.Fatalf("live adapter test-connection: %v",err) }
              var definitions definitionPage
              if _, err := adapter.get(ctx, "_apis/build/definitions", url.Values{"$top":{"3"}}, &definitions); err != nil {
                  t.Fatalf("live adapter definition decode: %v", err)
              }
              if len(definitions.Value)==0 || definitions.Value[0].ID<=0 {
                  t.Fatal("live Azure definitions did not normalize")
              }
              var actual build
              if _, err := adapter.get(ctx, "_apis/build/builds/"+strconv.FormatInt(expectedBuildID,10), nil, &actual); err != nil {
                  // Some public projects expose list-only build details.
                  var page buildPage
                  if _, fallbackErr := adapter.get(ctx,"_apis/build/builds",url.Values{
                      "buildIds": {strconv.FormatInt(expectedBuildID,10)}, "$top":{"1"},
                  },&page); fallbackErr != nil || len(page.Value)!=1 {
                      t.Fatalf("live adapter single-build read failed: %v; list fallback: %v",err,fallbackErr)
                  }
                  actual=page.Value[0]
              }
              if actual.ID!=expectedBuildID || actual.Definition.ID!=expectedDefinitionID {
                  t.Fatalf("live build identity mismatch: got id=%d definition=%d, expected id=%d definition=%d",
                      actual.ID,actual.Definition.ID,expectedBuildID,expectedDefinitionID)
              }
              normalized,err:=adapter.normalizeBuild(expectedDefinitionID,actual)
              if err != nil { t.Fatalf("live normalization failed: %v",err) }
              if normalized.ProviderKey!=strconv.FormatInt(expectedBuildID,10) ||
                  normalized.PipelineKey!=definitionExternalKey(expectedDefinitionID) ||
                  normalized.URL!=fmt.Sprintf("%s/_build/results?buildId=%d",endpoint,expectedBuildID) {
                  t.Fatalf("live provider run identity/link incorrect: %+v",normalized)
              }
              t.Logf("LIVE_PUBLIC_SYNAPSE_ADAPTER_PASS endpoint=%s definition=%d build=%d lifecycle=%s result=%s",
                  endpoint,expectedDefinitionID,expectedBuildID,normalized.Lifecycle,normalized.Result)
          }
          GO
          AZURE_EVIDENCE_FILE="$PWD/evidence/public-azure-api.json" go test -count=1 -v -run "^TestLivePublicAzureProvider$" ./internal/infrastructure/integration/azurepipelines

      - name: Capture real public Azure build page if API returned a build
        shell: bash
        run: |
          if [ ! -s evidence/live_web_url.txt ]; then
            echo "No public run URL was verified; no Azure UI screenshot claimed."
            exit 0
          fi
          chrome="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$chrome" ]; then
            echo "Headless browser unavailable; JSON and logs remain the proof."
            exit 0
          fi
          timeout 45s "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --window-size=1440,1000 --virtual-time-budget=12000 \
            --screenshot="$PWD/evidence/public-azure-ui-unreviewed.png" \
            "$(head -n 1 evidence/live_web_url.txt)" || true
          echo "Screenshot captured from a public live page if the file exists; inspect before making any claim."

      - name: Upload self-contained proof for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-1455-public-evidence
          path: evidence/
          if-no-files-found: warn
               ./internal/infrastructure/integration/azurepipelines

      - name: Capture real public Azure build page if API returned a build
        shell: bash
        run: |
          if [ ! -s evidence/live_web_url.txt ]; then
            echo "No public run URL was verified; no Azure UI screenshot claimed."
            exit 0
          fi
          chrome="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$chrome" ]; then
            echo "Headless browser unavailable; JSON and logs remain the proof."
            exit 0
          fi
          timeout 45s "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --window-size=1440,1000 --virtual-time-budget=12000 \
            --screenshot="$PWD/evidence/public-azure-ui-unreviewed.png" \
            "$(head -n 1 evidence/live_web_url.txt)" || true
          echo "Screenshot captured from a public live page if the file exists; inspect before making any claim."

      - name: Upload self-contained proof for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-1455-public-evidence
          path: evidence/
          if-no-files-found: warn
