name: Codex 402 harden legacy source capture

on:
  push:
    branches:
      - codex/402-sanctioned-source-publish

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/402-sanctioned-source-publish
      - name: Harden source artifact capture
        shell: python
        run: |
          from pathlib import Path

          p = Path("internal/infrastructure/sourceartifact/store.go")
          text = p.read_text()

          old = '"github.com/KKloudTarus/synapse-ce/internal/domain/shared"\n\t"github.com/KKloudTarus/synapse-ce/internal/usecase/ports"'
          new = '"github.com/KKloudTarus/synapse-ce/internal/domain/shared"\n\t"github.com/KKloudTarus/synapse-ce/internal/domain/sourcepolicy"\n\t"github.com/KKloudTarus/synapse-ce/internal/usecase/ports"'
          if text.count(old) != 1:
              raise SystemExit(f"sourcepolicy import anchor count={text.count(old)}")
          text = text.replace(old, new)

          duplicate = '''\tif err := s.validateSourceIsolation(sourceDir); err != nil {\n\t\treturn unavailable(projectanalysis.UnavailableCaptureFailed), err\n\t}\n\tif err := s.validateSourceIsolation(sourceDir); err != nil {\n\t\treturn unavailable(projectanalysis.UnavailableCaptureFailed), err\n\t}\n'''
          single = '''\tif err := s.validateSourceIsolation(sourceDir); err != nil {\n\t\treturn unavailable(projectanalysis.UnavailableCaptureFailed), err\n\t}\n'''
          if text.count(duplicate) != 1:
              raise SystemExit(f"duplicate isolation anchor count={text.count(duplicate)}")
          text = text.replace(duplicate, single)

          canonical = '''\t\tpath, err := measure.CanonicalPath(filepath.ToSlash(rel))\n\t\tif err != nil || path == "" {\n\t\t\treturn fmt.Errorf("invalid source path: %w", err)\n\t\t}\n\t\tif len(manifest.Files) >= s.maxFiles {\n'''
          canonical_new = '''\t\tpath, err := measure.CanonicalPath(filepath.ToSlash(rel))\n\t\tif err != nil || path == "" {\n\t\t\treturn fmt.Errorf("invalid source path: %w", err)\n\t\t}\n\t\tif !sourcepolicy.RetainPath(path) {\n\t\t\treturn nil\n\t\t}\n\t\tif len(manifest.Files) >= s.maxFiles {\n'''
          if text.count(canonical) != 1:
              raise SystemExit(f"head policy anchor count={text.count(canonical)}")
          text = text.replace(canonical, canonical_new)

          publish = '''\tif err := os.RemoveAll(captureRoot); err != nil {\n\t\treturn unavailable(projectanalysis.UnavailableCaptureFailed), fmt.Errorf("replace source artifact: %w", err)\n\t}\n\tif err := os.Rename(tmp, captureRoot); err != nil {\n\t\treturn unavailable(projectanalysis.UnavailableCaptureFailed), fmt.Errorf("publish source artifact: %w", err)\n\t}\n\treturn projectanalysis.SourceCapture{Capabilities: availableCapabilities(), Manifest: manifest}, nil\n'''
          publish_new = '''\tif err := os.Mkdir(captureRoot, 0o700); err != nil {\n\t\tif errors.Is(err, fs.ErrExist) {\n\t\t\treturn unavailable(projectanalysis.UnavailableAlreadyRetained), shared.ErrConflict\n\t\t}\n\t\treturn unavailable(projectanalysis.UnavailableCaptureFailed), fmt.Errorf("claim source artifact: %w", err)\n\t}\n\tpublished := false\n\tdefer func() {\n\t\tif !published {\n\t\t\t_ = os.RemoveAll(captureRoot)\n\t\t}\n\t}()\n\tif err := os.Rename(filepath.Join(tmp, "blobs"), filepath.Join(captureRoot, "blobs")); err != nil {\n\t\treturn unavailable(projectanalysis.UnavailableCaptureFailed), fmt.Errorf("publish source blobs: %w", err)\n\t}\n\tif err := os.Rename(filepath.Join(tmp, "manifest.json"), filepath.Join(captureRoot, "manifest.json")); err != nil {\n\t\treturn unavailable(projectanalysis.UnavailableCaptureFailed), fmt.Errorf("publish source manifest: %w", err)\n\t}\n\tpublished = true\n\treturn projectanalysis.SourceCapture{Capabilities: availableCapabilities(), Manifest: manifest}, nil\n'''
          if text.count(publish) != 1:
              raise SystemExit(f"head create-only publish anchor count={text.count(publish)}")
          text = text.replace(publish, publish_new)

          base = '''\tfor path := range files {\n\t\tcanonical, err := measure.CanonicalPath(path)\n\t\tif err != nil || canonical == "" || canonical != path {\n\t\t\treturn projectanalysis.SourceManifest{}, fmt.Errorf("%w: base source path is invalid", shared.ErrValidation)\n\t\t}\n\t\tpaths = append(paths, path)\n\t}\n\tsort.Strings(paths)\n'''
          base_new = '''\tfor path := range files {\n\t\tcanonical, err := measure.CanonicalPath(path)\n\t\tif err != nil || canonical == "" || canonical != path {\n\t\t\treturn projectanalysis.SourceManifest{}, fmt.Errorf("%w: base source path is invalid", shared.ErrValidation)\n\t\t}\n\t\tif !sourcepolicy.RetainPath(path) {\n\t\t\tcontinue\n\t\t}\n\t\tpaths = append(paths, path)\n\t}\n\tif len(paths) == 0 {\n\t\tmanifest.SetArtifactDigest()\n\t\treturn manifest, nil\n\t}\n\tsort.Strings(paths)\n'''
          if text.count(base) != 1:
              raise SystemExit(f"base policy anchor count={text.count(base)}")
          text = text.replace(base, base_new)

          base_publish = '''\tif err := os.RemoveAll(root); err != nil {\n\t\treturn projectanalysis.SourceManifest{}, fmt.Errorf("replace base source artifact: %w", err)\n\t}\n\tif err := os.Rename(tmp, root); err != nil {\n\t\treturn projectanalysis.SourceManifest{}, fmt.Errorf("publish base source artifact: %w", err)\n\t}\n\treturn manifest, nil\n'''
          base_publish_new = '''\tif err := os.Mkdir(root, 0o700); err != nil {\n\t\tif errors.Is(err, fs.ErrExist) {\n\t\t\treturn projectanalysis.SourceManifest{}, shared.ErrConflict\n\t\t}\n\t\treturn projectanalysis.SourceManifest{}, fmt.Errorf("claim base source artifact: %w", err)\n\t}\n\tpublished := false\n\tdefer func() {\n\t\tif !published {\n\t\t\t_ = os.RemoveAll(root)\n\t\t}\n\t}()\n\tif err := os.Rename(filepath.Join(tmp, "blobs"), filepath.Join(root, "blobs")); err != nil {\n\t\treturn projectanalysis.SourceManifest{}, fmt.Errorf("publish base source blobs: %w", err)\n\t}\n\tif err := os.Rename(filepath.Join(tmp, "manifest.json"), filepath.Join(root, "manifest.json")); err != nil {\n\t\treturn projectanalysis.SourceManifest{}, fmt.Errorf("publish base source manifest: %w", err)\n\t}\n\tpublished = true\n\treturn manifest, nil\n'''
          if text.count(base_publish) != 1:
              raise SystemExit(f"base create-only publish anchor count={text.count(base_publish)}")
          text = text.replace(base_publish, base_publish_new)
          p.write_text(text)

          p = Path("internal/usecase/sca/service.go")
          text = p.read_text()
          old = '''\tif opts.ProjectAnalysis {\n\t\ts.captureProjectSource(ctx, engagementID, opts.ProjectAnalysisID, ws.Dir, result)\n\t\ts.captureProjectComparison(ctx, engagementID, opts.ProjectAnalysisID, ws.Dir, ws.Commit, result)\n\t}\n'''
          new = '''\tif opts.ProjectAnalysis {\n\t\ts.captureProjectSource(ctx, engagementID, opts.ProjectAnalysisID, ws.Dir, result)\n\t\tif result.SourceCapture != nil && result.SourceCapture.Capabilities.Source.Available {\n\t\t\ts.captureProjectComparison(ctx, engagementID, opts.ProjectAnalysisID, ws.Dir, ws.Commit, result)\n\t\t}\n\t}\n'''
          if text.count(old) != 1:
              raise SystemExit(f"project capture call-site anchor count={text.count(old)}")
          p.write_text(text.replace(old, new))
      - name: Format and test hardened capture
        run: |
          gofmt -w internal/infrastructure/sourceartifact/store.go internal/usecase/sca/service.go
          git diff --check
          go test ./internal/infrastructure/sourceartifact ./internal/usecase/sca
      - name: Commit and remove helper
        run: |
          rm .github/workflows/codex-harden-402-legacy-capture.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A internal/infrastructure/sourceartifact/store.go internal/usecase/sca/service.go .github/workflows/codex-harden-402-legacy-capture.yml
          git commit -m "fix(appsec): harden server-side source capture"
          git push
