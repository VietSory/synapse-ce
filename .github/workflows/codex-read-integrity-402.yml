name: Codex 402 source read integrity

on:
  push:
    branches:
      - codex/402-sanctioned-source-publish

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bind loaded source to persisted manifest
        shell: python
        run: |
          from pathlib import Path
          p = Path("internal/usecase/projectuc/code_viewer.go")
          text = p.read_text()
          old = '''\tif baseSide {\n\t\tdata, source, err = s.sourceArtifacts.LoadBase(ctx, tenantID, shared.ID(analysis.ProjectID), analysis.ID, canonical)\n\t} else {\n\t\tdata, source, err = s.sourceArtifacts.Load(ctx, tenantID, shared.ID(analysis.ProjectID), analysis.ID, canonical)\n\t}\n\tif err != nil {\n\t\treturn CodeFileView{}, analysis.Capabilities, err\n\t}\n\tlines := splitCodeLines(string(data))\n'''
          new = '''\tif baseSide {\n\t\tdata, source, err = s.sourceArtifacts.LoadBase(ctx, tenantID, shared.ID(analysis.ProjectID), analysis.ID, canonical)\n\t} else {\n\t\tdata, source, err = s.sourceArtifacts.Load(ctx, tenantID, shared.ID(analysis.ProjectID), analysis.ID, canonical)\n\t}\n\tif err != nil {\n\t\treturn CodeFileView{}, analysis.Capabilities, err\n\t}\n\texpectedSource, found := persistedSourceFileForRead(analysis, canonical, baseSide)\n\tif !found || source != expectedSource {\n\t\treturn CodeFileView{}, analysis.Capabilities, projectanalysis.ErrSourceIntegrity\n\t}\n\tlines := splitCodeLines(string(data))\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one ReadCodeFile load anchor, found {text.count(old)}")
          p.write_text(text.replace(old, new, 1))
      - name: Format and verify
        run: |
          gofmt -w internal/usecase/projectuc/code_viewer.go
          git diff --check
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/usecase/projectuc/code_viewer.go
          git diff --cached --quiet && exit 0
          git commit -m "fix(appsec): bind source reads to analysis manifest"
          git push origin HEAD:codex/402-sanctioned-source-publish
