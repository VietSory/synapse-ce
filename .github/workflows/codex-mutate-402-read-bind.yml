name: Codex 402 mutate read binding

on:
  push:
    branches:
      - codex/402-mutation-no-read-bind

permissions:
  contents: write

jobs:
  mutate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/402-mutation-no-read-bind
      - name: Remove persisted manifest binding
        shell: python
        run: |
          from pathlib import Path
          path = Path("internal/usecase/projectuc/code_viewer.go")
          text = path.read_text()
          old = '''\texpectedSource, found := persistedSourceFileForRead(analysis, canonical, baseSide)\n\tif !found || source != expectedSource {\n\t\treturn CodeFileView{}, analysis.Capabilities, projectanalysis.ErrSourceIntegrity\n\t}\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one read-binding guard, found {text.count(old)}")
          path.write_text(text.replace(old, ""))
      - name: Commit mutation and remove helper
        run: |
          rm .github/workflows/codex-mutate-402-read-bind.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/usecase/projectuc/code_viewer.go .github/workflows/codex-mutate-402-read-bind.yml
          git commit -m "test(mutation): remove source read binding"
          git push
